# Deployment stack. Local infrastructure is added by compose.local.yaml.
x-node: &node
  image: ${NEXUS_IMAGE:-nexus:local}
  build:
    context: .
    dockerfile: infra/node/Dockerfile
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  KAFKA_BROKERS: ${KAFKA_BROKERS:?Set KAFKA_BROKERS}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
  KAFKA_TOPIC: ${KAFKA_TOPIC:-osint.raw.v1}
  KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-osint.quarantine.v1}
  KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-nexus-normalizer-v1}
  KAFKA_STREAM_ID: ${KAFKA_STREAM_ID:?Set KAFKA_STREAM_ID}
services:
  api:
    <<: *node
    command: [node, apps/api/dist/index.js]
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: 3000
    ports: ["${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  worker:
    <<: *node
    command: [node, apps/worker/dist/index.js]
    environment: *app-env
    depends_on:
      setup: { condition: service_completed_successfully }
  setup:
    <<: *node
    restart: "no"
    command: [node, scripts/setup.mjs]
    depends_on:
      connect: { condition: service_healthy }
    environment:
      <<: *app-env
      CONNECT_URL: http://connect:8083
      S3_TARGET: ${S3_TARGET:-local}
      S3_BUCKET: ${S3_BUCKET:-nexus-raw}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
  connect:
    image: ${CONNECT_IMAGE:-nexus-connect:local}
    build: ./infra/connect
    restart: unless-stopped
    ports: ["127.0.0.1:${CONNECT_PORT:-8083}:8083"]
    environment:
      CONNECT_BOOTSTRAP_SERVERS: ${KAFKA_BROKERS:?Set KAFKA_BROKERS}
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: ${CONNECT_GROUP_ID:-nexus-connect}
      CONNECT_CONFIG_STORAGE_TOPIC: ${CONNECT_CONFIG_STORAGE_TOPIC:-_nexus-connect-configs}
      CONNECT_OFFSET_STORAGE_TOPIC: ${CONNECT_OFFSET_STORAGE_TOPIC:-_nexus-connect-offsets}
      CONNECT_STATUS_STORAGE_TOPIC: ${CONNECT_STATUS_STORAGE_TOPIC:-_nexus-connect-status}
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: ${CONNECT_REPLICATION_FACTOR:-1}
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: ${CONNECT_REPLICATION_FACTOR:-1}
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: ${CONNECT_REPLICATION_FACTOR:-1}
      CONNECT_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CONNECT_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      CONNECT_SASL_JAAS_CONFIG: ${KAFKA_SASL_JAAS_CONFIG:-}
      CONNECT_CONSUMER_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CONNECT_CONSUMER_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: ${KAFKA_SASL_JAAS_CONFIG:-}
      CONNECT_PRODUCER_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      CONNECT_PRODUCER_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: ${KAFKA_SASL_JAAS_CONFIG:-}
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.converters.ByteArrayConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${S3_REGION:-us-east-1}
    healthcheck:
      test: [CMD-SHELL, "curl --fail http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 30
