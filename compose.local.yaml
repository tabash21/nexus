# Local infrastructure and Docker-internal addresses.
services:
  api:
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_local}@postgres:5432/${POSTGRES_DB:-nexus}
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_local}@postgres:5432/${POSTGRES_DB:-nexus}
      KAFKA_BROKERS: kafka:29092
      S3_BUCKET: nexus-raw
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      s3: { condition: service_healthy }
  enrichment-worker:
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_local}@postgres:5432/${POSTGRES_DB:-nexus}
      KAFKA_BROKERS: kafka:29092
      S3_BUCKET: nexus-raw
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
  setup:
    environment:
      NODE_ENV: development
      VERIFY_DATABASE_SCHEMA: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_local}@postgres:5432/${POSTGRES_DB:-nexus}
      KAFKA_BROKERS: kafka:29092
      S3_BUCKET: nexus-raw
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3:4566
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      s3: { condition: service_healthy }
  postgres:
    image: ${POSTGRES_IMAGE:-nexus-postgres:local}
    build: ./infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_local}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.0.2}
    ports: ["127.0.0.1:${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:29092, --list]
      interval: 10s
      timeout: 10s
      retries: 20
  s3:
    build: ./infra/localstack
    ports: ["127.0.0.1:${S3_PORT:-4566}:4566"]
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: [CMD-SHELL, "awslocal s3api head-bucket --bucket nexus-raw"]
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  postgres-data:
  kafka-data:
