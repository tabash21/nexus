# Deployment stack. Local infrastructure is added by compose.local.yaml.
x-node: &node
  image: ${NEXUS_IMAGE:-nexus:local}
  build:
    context: .
    dockerfile: infra/node/Dockerfile
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  KAFKA_BROKERS: ${KAFKA_BROKERS:?Set KAFKA_BROKERS}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
  KAFKA_PLATFORMS: ${KAFKA_PLATFORMS:-telegram,x,news,reddit,threads,instagram,tiktok,youtube,bluesky,facebook}
  KAFKA_SOURCES: ${KAFKA_SOURCES:-}
  KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-osint.quarantine.v1}
  KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-nexus-items-v1}
  KAFKA_STREAM_ID: ${KAFKA_STREAM_ID:?Set KAFKA_STREAM_ID}
  KAFKA_SILVER_TOPIC: ${KAFKA_SILVER_TOPIC:-items.silver}
  KAFKA_SILVER_GROUP_ID: ${KAFKA_SILVER_GROUP_ID:-nexus-silver-writer-v1}
  KAFKA_GOLD_TOPIC: ${KAFKA_GOLD_TOPIC:-items.gold}
  S3_BUCKET: ${S3_BUCKET:-nexus-raw}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
services:
  api:
    <<: *node
    command: [node, apps/api/dist/index.js]
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: 3000
    ports: ["${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  worker:
    <<: *node
    command: [node, apps/worker/dist/index.js]
    environment: *app-env
    depends_on:
      setup: { condition: service_completed_successfully }
  enrichment-worker:
    <<: *node
    command: [node, apps/enrichment-worker/dist/index.js]
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      <<: *app-env
  setup:
    <<: *node
    restart: "no"
    command: [node, scripts/setup/index.mjs]
    environment:
      <<: *app-env
      VERIFY_DATABASE_SCHEMA: ${VERIFY_DATABASE_SCHEMA:-false}
      SCHEMA_REFERENCE_DATABASE_URL: ${SCHEMA_REFERENCE_DATABASE_URL:-}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
